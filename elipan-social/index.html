<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ELIPAN Social</title><meta name="description" content="ELIPAN Social: the social media command center for ELIPAN GROUP. Today's AI and tech news, matched to every brand.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200.5 179.3'%3E%3Cpath fill='%23141414' fill-rule='evenodd' d='M0.8 66.0 L0.0 68.5 L0.0 127.8 L1.7 130.2 L3.0 130.8 L61.3 131.2 L62.3 132.7 L62.3 177.7 L63.7 179.0 L118.8 179.3 L121.3 178.0 L122.3 176.2 L122.3 124.2 L121.3 121.8 L120.0 120.5 L118.0 119.5 L112.5 119.3 L64.5 119.5 L61.7 119.2 L59.0 117.7 L56.3 113.5 L56.3 68.3 L55.3 66.2 L53.0 64.3 L3.3 64.2Z M63.3 1.3 L62.3 3.5 L62.3 52.2 L63.3 54.7 L64.8 56.2 L67.0 57.0 L109.7 57.0 L113.0 57.8 L114.5 58.8 L144.5 91.7 L145.0 92.8 L145.2 114.0 L146.2 115.8 L147.8 117.2 L149.3 117.7 L197.0 117.7 L199.7 115.8 L200.3 114.5 L200.5 57.7 L198.7 54.7 L196.2 53.5 L125.0 53.3 L123.5 52.2 L122.3 49.7 L122.5 1.2 L121.8 0.2 L65.5 0.0Z'/%3E%3C/svg%3E">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Courier+Prime:wght@400;700&amp;family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.m{--bg:#000000;--card:#0B0B0B;--raised:#121212;--hover:#181818;--line:#222222;--line2:#3A3A3A;--ink:#FFFFFF;--ink2:#CFCFCF;--muted:#A0A0A0;--swap:#FFFFFF;--swap-ink:#000000;--bar:rgba(0,0,0,0.88);--shadow:0 1px 2px rgba(0,0,0,0.8), 0 14px 36px rgba(0,0,0,0.7);--warn:#E3A33B;--bad:#E5484D;color-scheme:dark}
.m.light{--bg:#FFFFFF;--card:#FFFFFF;--raised:#F1F3F5;--hover:#EEF0F3;--line:#E3E6EA;--line2:#D3D8DE;--ink:#232527;--ink2:#3A3D41;--muted:#6B7079;--swap:#232527;--swap-ink:#FFFFFF;--bar:rgba(255,255,255,0.9);--shadow:0 2px 4px rgba(35,37,39,0.06), 0 12px 28px rgba(35,37,39,0.10);--warn:#9A6B00;--bad:#C62828;color-scheme:light}
.m a{color:inherit}
.m .lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:0.16em;color:var(--muted)}
.m .h{margin:0;font-family:Archivo,sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:-0.02em;line-height:1}
.m .nav{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border-radius:10px;color:var(--ink2);text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0.14em;background:transparent;border:0;cursor:pointer}
.m .obtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--line2);border-radius:10px;background:transparent;color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0.12em;cursor:pointer;text-decoration:none;white-space:nowrap}
.m .obtn:disabled{opacity:.4;cursor:not-allowed}
.m .wbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:0;border-radius:10px;background:var(--swap);color:var(--swap-ink);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0.12em;cursor:pointer;text-decoration:none;white-space:nowrap}
.m .aibtn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1px dashed var(--line2);background:transparent;color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:0.12em;cursor:pointer}
.m .opt{min-height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink2);font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:0.1em;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.m .opt[aria-pressed="true"]{background:var(--swap);color:var(--swap-ink);border-color:var(--swap)}
.m .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow);box-sizing:border-box}
.m .field{display:block;box-sizing:border-box;width:100%;padding:14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-family:Inter,sans-serif;font-size:15px;line-height:1.6;resize:vertical}
.m .chk{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
.m .chk:first-of-type{border-top:0}
.m .chk b{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.m .chk.ok b{background:var(--swap);color:var(--swap-ink)}
.m .chk.warn b{border:1.5px solid var(--warn);color:var(--warn);box-sizing:border-box}
.m .chk.bad b{background:var(--bad);color:#FFFFFF}
.m .topic{display:flex;flex-direction:column;gap:12px;padding:22px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.m .sec{display:flex;flex-direction:column;gap:8px;padding:18px 0;border-top:1px solid var(--line)}
.m .sec:first-of-type{border-top:0}
.m .pill{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line2);font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:0.1em;color:var(--ink2)}

/* ===== NEWS BOARD · site-wide ===== */
.m .card{background:transparent !important;border:0 !important;border-top:2px solid var(--ink) !important;border-radius:0 !important;box-shadow:none !important;padding:18px 0 0 !important}
.m .topic{background:transparent !important;border:0 !important;border-top:1px solid var(--line2) !important;border-radius:0 !important;padding:18px 0 4px !important}
.m main h1.h{border-bottom:1px solid var(--ink);padding-bottom:12px}
.m main section > div > h1.h, .m main .card h1.h{border-bottom:0;padding-bottom:0}
.m .live{display:inline-flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:0.16em;color:var(--bad)}
.m .live i{width:8px;height:8px;border-radius:50%;background:var(--bad);animation:livepulse 1.4s ease-in-out infinite}
@keyframes livepulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.m .tick{overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.m .tick > div{display:inline-flex;gap:40px;padding-left:20px;animation:tickmove 300s linear infinite}
.m .tick:hover > div{animation-play-state:paused}
@keyframes tickmove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.m .tick > div{animation:none}.m .live i{animation:none}}

/* scrambled masthead */
.m .scr{position:relative;display:inline-block;color:transparent;animation:scrIn 0s linear forwards;animation-delay:var(--d)}
.m .scr::before{content:"";position:absolute;left:0;right:0;top:0;text-align:center;color:var(--ink);animation-duration:var(--d);animation-timing-function:steps(1);animation-fill-mode:forwards}
.m .scr.s1::before{animation-name:scr1}.m .scr.s2::before{animation-name:scr2}.m .scr.s3::before{animation-name:scr3}
@keyframes scrIn{to{color:var(--ink)}}
@keyframes scr1{0%{content:"$"}10%{content:"!"}20%{content:"*"}30%{content:"3"}40%{content:"4"}50%{content:"@"}60%{content:"Ø"}70%{content:"Z"}80%{content:"%"}90%{content:"#"}100%{content:""}}@keyframes scr2{0%{content:"!"}10%{content:"Ø"}20%{content:"$"}30%{content:"="}40%{content:"4"}50%{content:"@"}60%{content:"*"}70%{content:"/"}80%{content:"3"}90%{content:"%"}100%{content:""}}@keyframes scr3{0%{content:"Z"}10%{content:"K"}20%{content:"4"}30%{content:"7"}40%{content:"@"}50%{content:"Ø"}60%{content:"3"}70%{content:"!"}80%{content:"%"}90%{content:"?"}100%{content:""}}
@media (prefers-reduced-motion: reduce){.m .scr{color:var(--ink);animation:none}.m .scr::before{display:none}}
</style>
<style>.m.played .scr{animation:none!important;color:var(--ink)!important}.m.played .scr::before{display:none!important}body{margin:0}</style></head><body>
<template id="tpl">
<div class="{{rootClass}}" style="min-height: 100vh; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; padding-bottom: 72px;">

<header style="position: sticky; top: 0; z-index: 30; background: var(--bar); border-bottom: 1px solid var(--line); padding: 14px 28px;">
<div style="max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px;">
<div style="display: flex; align-items: center; gap: 12px;">
<span style="display: flex; align-items: center; gap: 14px; color: var(--ink);"><svg xmlns="http://www.w3.org/2000/svg" style="display: block; height: 30px; width: auto;" aria-hidden="true" viewBox="0 0 200.5 179.3"><path fill="currentColor" fill-rule="evenodd" d="M0.8 66.0 L0.0 68.5 L0.0 127.8 L1.7 130.2 L3.0 130.8 L61.3 131.2 L62.3 132.7 L62.3 177.7 L63.7 179.0 L118.8 179.3 L121.3 178.0 L122.3 176.2 L122.3 124.2 L121.3 121.8 L120.0 120.5 L118.0 119.5 L112.5 119.3 L64.5 119.5 L61.7 119.2 L59.0 117.7 L56.3 113.5 L56.3 68.3 L55.3 66.2 L53.0 64.3 L3.3 64.2Z M63.3 1.3 L62.3 3.5 L62.3 52.2 L63.3 54.7 L64.8 56.2 L67.0 57.0 L109.7 57.0 L113.0 57.8 L114.5 58.8 L144.5 91.7 L145.0 92.8 L145.2 114.0 L146.2 115.8 L147.8 117.2 L149.3 117.7 L197.0 117.7 L199.7 115.8 L200.3 114.5 L200.5 57.7 L198.7 54.7 L196.2 53.5 L125.0 53.3 L123.5 52.2 L122.3 49.7 L122.5 1.2 L121.8 0.2 L65.5 0.0Z"></path></svg><span role="img" aria-label="ELIPAN Social" style="display: inline-flex; align-items: center; gap: 12px; line-height: 1;"><span style="font-family: Archivo, sans-serif; font-weight: 900; font-size: 22px; letter-spacing: 0.22em; margin-right: -0.22em;">ELIPAN</span><span aria-hidden="true" style="width: 2px; height: 22px; background: currentColor;"></span><span style="font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 400; font-size: 15px; letter-spacing: 0.12em;">SOCIAL</span></span></span>
</div>
<sc-if value="{{showPicker}}" hint-placeholder-val="{{true}}">
<div style="position: relative;">
<button type="button" onClick="{{toggleMenu}}" aria-haspopup="menu" aria-expanded="{{menuStr}}" style="display: inline-flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; background: var(--card); border: 1px solid var(--line2); border-radius: 12px; color: var(--ink); cursor: pointer;">
<span class="lbl">{{headerLabel}}</span>
<span aria-hidden="true" style="{{headerDot}}"></span>
<span style="font-size: 16px; font-weight: 700;">{{headerBrand}}</span>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<sc-if value="{{menu}}" hint-placeholder-val="{{false}}">
<div role="menu" aria-label="Brands" style="position: absolute; top: calc(100% + 8px); left: 0; z-index: 40; width: 280px; background: var(--card); border: 1px solid var(--line2); border-radius: 14px; padding: 6px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px;">
<sc-for list="{{brandMenu}}" as="b" hint-placeholder-count="6">
<button type="button" role="menuitem" onClick="{{b.pick}}" style="{{b.style}}">
<span aria-hidden="true" style="{{b.dot}}"></span>
<span style="flex: 1; text-align: left;">{{b.name}}</span>
<span class="lbl">{{b.tag}}</span>
</button>
</sc-for>
</div>
</sc-if>
</div>
</sc-if>
</div>
<div style="display: flex; gap: 8px;">
<sc-if value="{{isHome}}" hint-placeholder-val="{{true}}"><button type="button" class="obtn" onClick="{{toggleNav}}" aria-expanded="{{navOpenStr}}">{{navLabel}}</button></sc-if>
<button type="button" class="obtn" onClick="{{toggleTheme}}" aria-pressed="{{lightStr}}">{{themeLabel}}</button>
</div>
</div>
<sc-if value="{{showNav}}" hint-placeholder-val="{{false}}">
<nav aria-label="Main" style="max-width: 1280px; margin: 14px auto 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;">
<sc-for list="{{steps}}" as="st" hint-placeholder-count="6">
<span style="{{st.gapStyle}}" aria-hidden="true"></span>
<button type="button" onClick="{{st.go}}" disabled="{{st.locked}}" aria-current="{{st.current}}" style="{{st.style}}">
<span style="{{st.numStyle}}">{{st.num}}</span>{{st.name}}
</button>
<span aria-hidden="true" style="{{st.arrow}}">→</span>
</sc-for>
</nav>
</sc-if>
<div style="max-width: 1280px; margin: 12px auto 0; display: flex; align-items: center; gap: 14px; border-top: 1px solid var(--line2); padding-top: 10px;">
<span class="live"><i aria-hidden="true"></i>LIVE</span>
<span class="lbl" style="flex: none;">UPDATED {{updatedAt}}</span>
<div class="tick" style="flex: 1; min-width: 0;" aria-label="Latest stories">
<div>
<sc-for list="{{ticker}}" as="tk" hint-placeholder-count="6">
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px;"><span aria-hidden="true" style="{{tk.dot}}"></span><span class="lbl" style="color: var(--ink);">{{tk.brandUpper}}</span><span style="color: var(--ink2);">{{tk.title}}</span><span class="lbl" style="{{tk.ageStyle}}">{{tk.age}}</span></span>
</sc-for>
<sc-if value="{{noLead}}" hint-placeholder-val="{{false}}"><span class="lbl">NO NEW STORIES IN THE LAST 24 HOURS · NEXT BRIEF 4:57 AM</span></sc-if>
</div>
</div>
</div>
</header>

<main style="max-width: 1280px; margin: 0 auto; padding: 32px 28px 0; box-sizing: border-box;">

<sc-if value="{{isHome}}" hint-placeholder-val="{{true}}">
<section style="display: flex; flex-direction: column;">

<div style="border-top: 6px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 10px 0; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px;">
<span class="lbl" style="color: var(--ink);">VOL. 1 · NO. {{issueNo}}</span>
<span class="lbl" style="color: var(--ink);">{{todayFull}}</span>
<span class="lbl" style="color: var(--ink);">ALL BRANDS EDITION</span>
</div>

<div style="padding: 30px 0 22px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;">
<h1 class="h" aria-label="ELIPAN Syntax and Snax" style="display: flex; flex-direction: column; align-items: center; gap: 0.06em; line-height: 0.9; letter-spacing: -0.035em;"><span aria-hidden="true" style="font-size: clamp(52px, 9.5vw, 128px);"><span class="scr s3" style="--d: 0.46s;">E</span><span class="scr s2" style="--d: 0.63s;">L</span><span class="scr s3" style="--d: 0.60s;">I</span><span class="scr s3" style="--d: 0.61s;">P</span><span class="scr s3" style="--d: 0.75s;">A</span><span class="scr s1" style="--d: 0.90s;">N</span></span><span aria-hidden="true" style="font-size: clamp(52px, 9.5vw, 128px);"><span class="scr s1" style="--d: 0.71s;">S</span><span class="scr s3" style="--d: 0.69s;">Y</span><span class="scr s3" style="--d: 0.90s;">N</span><span class="scr s2" style="--d: 1.06s;">T</span><span class="scr s3" style="--d: 1.04s;">A</span><span class="scr s3" style="--d: 1.11s;">X</span> <span class="scr s3" style="--d: 1.02s;">&amp;</span> <span class="scr s1" style="--d: 1.11s;">S</span><span class="scr s1" style="--d: 1.21s;">N</span><span class="scr s2" style="--d: 1.38s;">A</span><span class="scr s3" style="--d: 1.38s;">X</span></span></h1>
<span class="lbl">TODAY’S BOARD · CREDIBLE STORIES FROM THE LAST 24 HOURS ONLY, MATCHED TO A BRAND · BRIEF FILED 4:57 AM</span>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 6px;">
<button type="button" class="obtn" onClick="{{startBlank}}">START BLANK</button>

</div>
</div>

<div style="border-top: 1px solid var(--ink); padding: 12px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px;">
<span class="lbl" style="color: var(--ink); margin-right: 6px;">BRANDS</span>
<button type="button" class="obtn" onClick="{{allBrands}}" aria-pressed="{{allBrandsStr}}" style="{{allBrandsStyle}}">ALL BRANDS</button>
<sc-for list="{{brandRows}}" as="r" hint-placeholder-count="6">
<button type="button" class="obtn" onClick="{{r.go}}" disabled="{{r.soon}}" aria-pressed="{{r.onStr}}" style="{{r.chipStyle}}"><span aria-hidden="true" style="{{r.dot}}"></span><span style="font-weight: 700;">{{r.name}}</span><span style="color: var(--muted);">{{r.posted}}/{{r.goal}}</span></button>
</sc-for>
</div>
<div style="border-top: 1px solid var(--ink); border-bottom: 4px double var(--ink); display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
<div style="padding: 16px 20px; display: flex; flex-direction: column; gap: 6px; border-left: 1px solid var(--line2);">
<span class="lbl">{{k.label}}</span>
<div style="display: flex; align-items: baseline; gap: 8px;"><span class="h" style="font-size: 40px;">{{k.value}}</span><span class="lbl">{{k.unit}}</span></div>
<span style="font-size: 12px; line-height: 1.4; color: var(--muted);">{{k.note}}</span>
</div>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 0 32px; padding-top: 28px;">

<div style="grid-column: span 2; min-width: 0; display: flex; flex-direction: column; gap: 22px;">
<sc-if value="{{noLead}}" hint-placeholder-val="{{false}}">
<div style="padding: 40px 0; border-bottom: 1px solid var(--ink);"><h2 class="h" style="font-size: 40px;">No news in the last 24 hours.</h2><p style="margin: 12px 0 0; font-size: 16px; color: var(--ink2);">The 4:57 AM brief files new stories every morning. Start blank in the meantime.</p></div>
</sc-if>
<sc-if value="{{hasLead}}" hint-placeholder-val="{{true}}">
<article style="display: flex; flex-direction: column; gap: 14px; padding-bottom: 24px; border-bottom: 1px solid var(--ink);">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px;">
<span class="lbl" style="color: var(--ink);">{{lead.kicker}}</span>
<span class="lbl">FOR</span><span class="pill"><span aria-hidden="true" style="{{lead.dot}}"></span>&nbsp;{{lead.brandUpper}}</span>
<span class="lbl" style="{{lead.ageStyle}}">{{lead.age}}</span>
</div>
<h2 style="margin: 0; font-family: Archivo, sans-serif; font-weight: 900; font-size: clamp(34px, 4.4vw, 54px); line-height: 1.0; letter-spacing: -0.025em;">{{lead.title}}</h2>
<p style="margin: 0; font-size: 19px; line-height: 1.5; color: var(--ink2); max-width: 62ch;">{{lead.why}}</p>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px;">
<button type="button" style="{{lead.btn}}" onClick="{{lead.use}}">WRITE IT →</button>
<a href="{{lead.url}}" target="_blank" rel="noopener" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted);">SOURCE · {{lead.source}} ↗</a>
</div>
</article>
</sc-if>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0 28px;">
<sc-for list="{{seconds}}" as="t" hint-placeholder-count="2">
<article style="display: flex; flex-direction: column; gap: 10px; padding: 4px 0 22px;">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px;"><span aria-hidden="true" style="{{t.dot}}"></span><span class="lbl" style="color: var(--ink);">{{t.brandUpper}}</span><span class="lbl" style="{{t.ageStyle}}">· {{t.age}}</span></div>
<h3 style="margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: 24px; line-height: 1.15; letter-spacing: -0.01em;">{{t.title}}</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: var(--ink2);">{{t.why}}</p>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: auto;"><button type="button" class="obtn" style="min-height: 36px; padding: 0 12px;" onClick="{{t.use}}">WRITE IT →</button><a href="{{t.url}}" target="_blank" rel="noopener" style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted);">{{t.source}} ↗</a></div>
</article>
</sc-for>
</div>
</div>

<aside style="min-width: 0; display: flex; flex-direction: column; border-left: 1px solid var(--line2); padding-left: 28px;">
<span class="lbl" style="color: var(--ink); padding-bottom: 10px; border-bottom: 1px solid var(--ink);">MORE STORIES</span>
<sc-for list="{{mores}}" as="t" hint-placeholder-count="2">
<article style="display: flex; flex-direction: column; gap: 8px; padding: 16px 0; border-bottom: 1px solid var(--line2);">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px;"><span aria-hidden="true" style="{{t.dot}}"></span><span class="lbl" style="color: var(--ink);">{{t.brandUpper}}</span><span class="lbl" style="{{t.ageStyle}}">· {{t.age}}</span></div>
<h4 style="margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: 18px; line-height: 1.25;">{{t.title}}</h4>

OK · PHOTO SUBJECTS"}}, "nenemi": {"what": {"t": "A calm home for ADHD brains: set things down, pick them back up, never lose your place. Nenemi is Nahuatl for \"to come back.\"", "src": "NENEMI BRAND BOOK"}, "who": {"t": "Neurodivergent minds, people with ADHD. Built by a neurodivergent founder, for neurodivergent minds.", "src": "NENEMI BRAND BOOK"}, "voice": {"t": "Warm, plain, human. Never shames, never nags, never optimizes. Plain over clever. Reassuring over motivating. Present, not pushy.\nOne idea per post. Quotes over slogans. If a post would make an ADHD brain feel behind, it doesn't go out.", "src": "NENEMI BRAND BOOK"}, "lines": {"t": "\"Come back.\"\n\"You didn't fall behind. You stepped away.\"\n\"Welcome back. You left off here.\"\n\"Made for your brain. Not their expectations.\"", "src": "NENEMI BRAND BOOK"}, "avoid": {"t": "\"You're behind\" · Streaks broken · \"3 tasks overdue!\" · \"Boost your productivity\" · \"Don't forget!\" · Clinical \"ADHD tool\" framing · Anything that counts down or scolds · Invented statistics", "src": "NENEMI BRAND BOOK"}, "beat": {"t": "ADHD and executive-function research · neurodivergent tools and accessibility · calm tech vs. productivity guilt · founder lived experience", "src": "DRAFT · PLEASE CONFIRM"}, "channels": {"t": "Not decided yet. The book sets 4 post types: founder or community quote (the anchor), affirmation or return moment, one-screen product, warm win (rare).", "src": "NENEMI BRAND BOOK"}, "goal": {"t": "1 post a week", "src": "DRAFT · PLEASE CONFIRM"}, "type": {"t": "Archivo Black display · system sans body · monospace meta. Paper #FAF8F3, Ink #111312, Signature Teal #3C8692 for return moments, Maíz #E9BE55 only for warm wins. Never teal and maíz on one post.", "src": "NENEMI BRAND BOOK"}, "social": {"t": "Four post types: founder or community quote (the anchor), affirmation, return moment, one-screen product. Warm win posts are rare.\n• Mark small, top-left. Never centered and huge.\n• Real people, real light, real mess. No stock focus poses, no laptops-and-coffee.\n• One idea per post. Quotes over slogans. First names over titles.\n• Teal for return moments and quote marks. Maíz only for a warm win. Never both on one post.\n• If it counts down or scolds, or would make an ADHD brain feel behind, it doesn't go out.", "src": "NENEMI BRAND BOOK"}}};

  };
